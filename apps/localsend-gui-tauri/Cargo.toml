[package]
name = "localsend-gui-tauri"
version = "0.1.0"
edition = "2024"
publish = false

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
localsend-rpc = { path = "../../crates/localsend-rpc" }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1.49", features = ["full"] }
tauri = { version = "2", features = [] }
