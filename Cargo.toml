[workspace]
resolver = "3"
members = [
    "crates/*",
    "apps/localsendd",
    "apps/localsend-tray",
    "apps/localsend-tui",
    "apps/localsend-gui-slint",
    "apps/localsend-launcher",
    "apps/localsend-gui-egui",
]
exclude = [
    "apps/localsend-gui-fltk",
    "apps/localsend-gui-iced",
    "apps/localsend-gui-tauri",
]
default-members = [
    "apps/localsendd",
    "apps/localsend-tray",
    "apps/localsend-tui",
    "apps/localsend-gui-slint",
    "apps/localsend-launcher",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1.0"
bytes = "1.11"
chrono = { version = "0.4", features = ["serde"] }
directories = "6.0"
fs2 = "0.4"
futures-util = "0.3"
libc = "0.2"
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tempfile = "3"
thiserror = "2.0"
tokio = { version = "1.53", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.24", features = ["v4", "serde"] }

localsend-rpc = { path = "crates/localsend-rpc" }
localsend-platform = { path = "crates/localsend-platform" }
localsend-service = { path = "crates/localsend-service" }


[profile.dev]
debug = "line-tables-only"

[profile.dev.package.rsa]
opt-level = 2

[profile.dev.package.num-bigint-dig]
opt-level = 2
